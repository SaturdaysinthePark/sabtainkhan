[build.processing]
  skip_processing = true

# /book-giveaways is served by a separate Netlify site (repo:
# SaturdaysinthePark/book-giveaways) proxied in at the edge, so its twice-daily
# data commits never rebuild this site. A Netlify custom domain attaches to a
# site root, not a path, so a 200-status rewrite is the only way to mount it here.
#
# Both forms proxy directly — no 301 between them. Netlify ignores trailing
# slashes when matching, so a "/book-giveaways" -> "/book-giveaways/" redirect
# matches its own target and loops forever. The page resolves its data file
# against its own directory, so it works at either URL without one.

[[redirects]]
  from = "/book-giveaways"
  to = "https://book-giveaways.netlify.app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/book-giveaways/*"
  to = "https://book-giveaways.netlify.app/:splat"
  status = 200
  force = true

# /greek-family-tree is served by a separate Netlify site
# (https://greek-family-tree.netlify.app, app mounted at /greek-family-tree/)
# proxied in the same way as /book-giveaways above.
#
# Same trailing-slash caveat: Netlify ignores trailing slashes when matching, so
# a "/greek-family-tree" -> "/greek-family-tree/" 301 would match its own target
# and loop. The bare path is proxied directly to the slashed upstream URL instead.
# The legacy /greekfamilytree spelling is a different path, so a real 301 is safe.

[[redirects]]
  from = "/greek-family-tree"
  to = "https://greek-family-tree.netlify.app/greek-family-tree/"
  status = 200
  force = true

[[redirects]]
  from = "/greek-family-tree/*"
  to = "https://greek-family-tree.netlify.app/greek-family-tree/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/greekfamilytree"
  to = "/greek-family-tree/"
  status = 301
  force = true

[[redirects]]
  from = "/greekfamilytree/*"
  to = "/greek-family-tree/:splat"
  status = 301
  force = true
